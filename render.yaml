databases:
  - name: seats-db
    plan: free
    databaseName: seats
    user: seats

services:
  - type: web
    name: seat-service
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seats-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_POOL_MAX
        value: "15"
