services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
      POSTGRES_DB: seats
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://seats:seats@db:5432/seats
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    ports:
      - "8000:8000"

volumes:
  pgdata:
